<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Voltamos em breve — Start América</title>
<link rel="icon" type="image/png" href="assets/img/LOGO-ICON-FAV-ICON.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:Inter,system-ui,sans-serif;color:#fff;background:#060C16;
    min-height:100vh;display:flex;align-items:center;
    background-image:url("assets/img/planos-bg.png");
    background-size:cover;background-position:right center;background-repeat:no-repeat;
  }
  main{width:100%;padding:48px clamp(24px,6vw,96px);max-width:min(100%,720px)}
  img{display:block;width:150px;height:auto;margin-bottom:40px}
  h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(34px,5.5vw,64px);line-height:1.08;color:#E2C98A;text-wrap:balance}
  p{margin-top:20px;font-size:clamp(15px,1.6vw,18px);line-height:1.6;color:rgba(255,255,255,.82);max-width:46ch}
  @media (max-width:767px){
    body{background-position:70% center}
    body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(6,12,22,.85),rgba(6,12,22,.45));z-index:0}
    main{position:relative;z-index:1}
  }
</style>
</head>
<body>
<main>
  <img src="assets/img/logo-start-america-dourada.png" alt="Start América" width="150" height="112" />
  <h1>Voltamos em breve</h1>
  <p>Estamos fazendo melhorias no nosso site. Em breve estaremos de volta com novidades.</p>
</main>
</body>
</html>
